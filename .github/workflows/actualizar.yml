name: Actualizar datos
on:
  schedule:
    - cron: "0 11 * * 1" # lunes 06:00 en Lima
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # Si la captura no valida o cae más de 10 %, el script sale con 1 y no escribe nada: el job falla y se nota.
      - run: |
          set +e
          bun run actualizar > reporte.json
          s=$?
          cat reporte.json
          exit $s
      - run: bun test
      # Los PR creados con GITHUB_TOKEN no disparan CI: probamos aquí el paquete con los datos nuevos.
      - run: bun run build && node scripts/humo.mjs
      - name: Resumen
        id: resumen
        run: |
          {
            echo 'cuerpo<<EOF'
            echo 'Captura automática de GEOCATMIN. Revisar `cambios_vs_anterior` y `calidad` antes de publicar.'
            echo
            echo '```json'
            cat reporte.json
            echo '```'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          rm reporte.json
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: actualizar-datos
          commit-message: "datos: captura semanal de GEOCATMIN"
          title: "Datos: captura semanal de GEOCATMIN"
          body: ${{ steps.resumen.outputs.cuerpo }}
